server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /health/live {
        default_type text/plain;
        access_log  off;
        return 200 "OK";
    }

    location /health/ready {
        default_type text/plain;
        access_log  off;
        return 200 "OK";
    }

    location /health/started {
        default_type text/plain;
        access_log  off;
        return 200 "OK";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'none'; connect-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'";
        try_files $uri $uri/ /index.html;
    }
}
