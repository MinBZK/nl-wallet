apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  {{- with .Values.extraAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "common.labels.selectorLabels" . | nindent 6 }}
  {{- with .Values.deployment }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "common.labels.standard" . | nindent 8 }}
        {{- if .Values.extraPodLabels }}
        {{- toYaml .Values.extraPodLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: {{ include "common.names.fullname" . }}
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "common.defineProbes" .Values.probes | fromYaml | toYaml | nindent 10 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8001
          volumeMounts:
            - name: config-volume
              mountPath: /demo_index.toml
              subPath: config.toml
            {{- with .Values.wrpacCrl.configMapName }}
            - name: wrpac-crl-volume
              mountPath: /assets/wrpac.crl.der
              subPath: wrpac.crl.der
              readOnly: true
            {{- end }}
          env:
            - name: DEMO_INDEX__STRUCTURED_LOGGING
              value: "true"
            - name: DEMO_INDEX__LOG_REQUESTS
              value: {{ .Values.logRequests | quote }}
            - name: RUST_LOG
              value: "debug,hyper=warn"
      volumes:
        - name: config-volume
          configMap:
            name: nl-wallet-demo-index-data
        {{- with .Values.wrpacCrl.configMapName }}
        - name: wrpac-crl-volume
          configMap:
            name: {{ . }}
            items:
              - key: {{ $.Values.wrpacCrl.key }}
                path: wrpac.crl.der
        {{- end }}
