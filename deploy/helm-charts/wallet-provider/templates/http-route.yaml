{{ $name := include "common.names.fullname" . }}
{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- with .Values.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with .Values.httpRoute.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ $name }}
          port: 80
    {{- if .Values.httpRoute.contextPath }}
      matches:
        - path:
            type: PathPrefix
            value: "/{{ .Values.httpRoute.contextPath }}/api/v1"
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: "/api/v1"
    {{- else }}
      matches:
        - path:
            type: PathPrefix
            value: "/api/v1"
      {{- if .Values.httpRoute.filters }}
      filters:
      {{- end }}
    {{- end }}
      {{- with .Values.httpRoute.filters }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{ if .Values.httpRouteAdminPortal.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-admin-portal
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- with .Values.httpRouteAdminPortal.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRouteAdminPortal.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with .Values.httpRouteAdminPortal.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRouteAdminPortal.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ $name }}
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: "/admin-portal"
      {{- with .Values.httpRouteAdminPortal.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{ if .Values.httpRouteInternal.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-internal
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- with .Values.httpRouteInternal.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRouteInternal.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with .Values.httpRouteInternal.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRouteInternal.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ $name }}
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: "/internal"
        - path:
            type: PathPrefix
            value: "/config"
        - path:
            type: PathPrefix
            value: "/health"
        - path:
            type: PathPrefix
            value: "/openapi.json"
        - path:
            type: PathPrefix
            value: "/api-docs"
      {{- with .Values.httpRouteInternal.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
