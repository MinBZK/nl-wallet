ignoreUntil = 2027-01-01
reason = "`proc-macro-error2` is a transitive dependency that is no longer maintained used by `sea-bae` (`sea-orm-macros`) and `serde_valid_derive` (`serde_valid`). Waiting for those crates to find alternatives."

