ai-a11y-scan-fetch-token:
  extends: .env-k8s
  image: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/nl-wallet-app-builder-ci-node:${BUILD_TAG}"
  rules:
    - if: $SCHEDULED == "ai-a11y-scan" && $CI_PIPELINE_SOURCE == "web"
  script:
    - CLAUDE_CODE_OAUTH_TOKEN="$(kubectl get secret nl-wallet-anthropic -o jsonpath='{.data.claude_code_oauth_token}' | base64 --decode)"
    - echo "CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}" > claude.env
  artifacts:
    access: none
    expire_in: 15 minutes
    reports:
      dotenv: claude.env

ai-a11y-scan:
  image: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/nl-wallet-app-builder-ci-node:${BUILD_TAG}"
  needs:
    - job: ai-a11y-scan-fetch-token
      artifacts: true
  rules:
    - if: $SCHEDULED == "ai-a11y-scan" && $CI_PIPELINE_SOURCE == "web"
  timeout: 3h
  variables:
    GIT_DEPTH: 0
    SCAN_MODEL: "claude-sonnet-4-6"
    CLAUDE_CODE_MAX_TURNS: "150"
    # Headless `claude -p` ends the session as soon as the model stops for input,
    # so a turn that ends with a clarifying question produces no report. This
    # system-prompt append forbids that: the agent must run to completion without
    # ever asking. Passed to the claude invocation via --append-system-prompt.
    NONINTERACTIVE: >-
      You are running non-interactively in a CI job with no human present.
      Never ask questions, never wait for confirmation, and never end your turn
      with a question. Always proceed and run the requested scan to completion,
      writing the output file before you finish. If the scope looks large, scan
      it in full anyway rather than pausing to ask how to narrow it.
  before_script:
    - npm i -g @anthropic-ai/claude-code
    - node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
    # Headless Claude ignores the project's .claude/settings.json allowlist unless the
    # workspace is trusted, and CI has no trust dialog. Mark the checkout directory as
    # trusted in ~/.claude.json so the skill's permission allowlist is loaded.
    - |
      node -e "
        const fs = require('fs');
        const path = require('path');
        const configFile = path.join(process.env.HOME, '.claude.json');
        let config = {};
        try { config = JSON.parse(fs.readFileSync(configFile, 'utf8')); } catch (e) {}
        config.projects = config.projects || {};
        const projectDir = process.env.CI_PROJECT_DIR;
        config.projects[projectDir] = { ...config.projects[projectDir], hasTrustDialogAccepted: true };
        fs.writeFileSync(configFile, JSON.stringify(config, null, 2));
        console.error('Trusted ' + projectDir);
      "
    - cd deploy/qa-util/ai-a11y-scan
    # Captures are stored (main only) by the e2e jobs as flat zips; unzip both
    # platforms into a single captures dir — each entry is <screen>.<platform>.{xml,png}.
    - mkdir -p captures
    - |
      sources=$(jq -n --arg scan "${CI_COMMIT_SHA:-unknown}" '{scan_commit: $scan}')
      for platform in android ios; do
        archive="qt/quality-time/a11y-captures/e2e-$platform.zip"
        if ! mc cp "$archive" "$platform.zip"; then
          echo "No $platform capture archive at $archive — skipping that platform"
          continue
        fi
        # Same attribute, and the same parse, that store-functions.sh writes and reads.
        sha=$(mc stat "$archive" | awk 'BEGIN { FS=": " } /^  X-Amz-Meta-Git-Commit-Sha/ { print $2 }' | tr -d '[:space:]')
        echo "$platform captures came from commit ${sha:-unknown}"
        sources=$(printf '%s' "$sources" | jq --arg p "$platform" --arg sha "${sha:-unknown}" --arg a "$archive" \
          '.[$p] = {commit: $sha, archive: $a}')
        # The archives are zipped on the macOS runner, so they carry an AppleDouble
        # `._<name>` shadow of every entry plus .DS_Store. Left in, those shadow
        # files look like captures to anything globbing *.xml.
        unzip -o -j "$platform.zip" -x '._*' '.DS_Store' -d captures
      done
      printf '%s\n' "$sources" > captures/sources.json
      cat captures/sources.json
    # Lets the review subagents sample exact pixels for contrast; without it they
    # fall back to reading the screenshot visually and more contrast checks come
    # back `incomplete`.
    - pip3 install --quiet --break-system-packages Pillow || true
    - |
      python3 -c 'import PIL; print("Pillow", PIL.__version__)' \
        || echo "Pillow unavailable - contrast will be read visually, not sampled"
  script:
    - |
      if [ -z "$(ls captures/*.xml 2>/dev/null)" ]; then
        echo "No a11y captures found in MinIO (qt/quality-time/a11y-captures/) — nothing to scan. Exiting successfully."
        exit 0
      fi
    # Headless `claude -p` denies a tool call that the allowlist does not cover
    # rather than prompting for it, so the trusted .claude/settings.json allowlist
    # is all that is needed here; a gap shows up as a denial in this log and is
    # caught by validate-report.sh below.
    - claude -p "/a11y-scan captures" --model "${SCAN_MODEL}" --verbose --append-system-prompt "$NONINTERACTIVE"
    # Gate on the report being complete
    - ./validate-report.sh A11Y-REPORT.json captures
    - test -f A11Y-REPORT.md || { echo "No A11Y-REPORT.md (report generation did not finish)"; exit 1; }
    # Publish the axe-form report to MinIO for downstream tooling. store-artifact.sh
    # tags it with the commit sha and only uploads on the default branch, matching
    # the main-only capture storage it was scanned from.
    - ../../../deploy/bin/store-artifact.sh A11Y-REPORT.json qt/quality-time/a11y-results/A11Y-REPORT.json
  artifacts:
    name: ai-a11y-scan
    when: always
    expire_in: 30 days
    paths:
      - deploy/qa-util/ai-a11y-scan/A11Y-REPORT.json
      - deploy/qa-util/ai-a11y-scan/A11Y-REPORT.md
