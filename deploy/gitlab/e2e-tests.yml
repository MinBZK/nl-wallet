  script: |
    cd uiautomation
    ./gradlew --no-daemon --info --stacktrace test --tests ${TEST_SUITE} \
      -Dtest.config.app.path="../${APP}" \
      -Dtest.config.app.identifier="nl.ictu.edi.wallet.latest" \
      -Dtest.config.device.udid="${IOS_DEVICE_UDID}" \
      -Dtest.config.platform.name="IOS" \
      -Dtest.config.platform.version="${IOS_PLATFORM_VERSION}" \
