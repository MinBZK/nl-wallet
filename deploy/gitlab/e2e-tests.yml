      -Dtest.config.app.identifier="nl.ictu.edi.wallet.latest" \
      -Dtest.config.app.path="../wallet_app/build/ios/iphonesimulator/Runner.app" \
      -Dtest.config.device.udid="${IOS_SIMULATOR_UDID}" \
