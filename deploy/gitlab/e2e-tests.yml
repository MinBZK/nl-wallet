      -Dtest.config.platform.version="${IOS_SIMULATOR_VERSION}" \
      -Dtest.config.remote=false \
      -Dfile.encoding=UTF-8 \
      || true
    compgen -G "build/test-results/test/*.xml"
  variables:
    IOS_SIMULATOR_UDID: "${SIMULATOR_UDID}"
    IOS_SIMULATOR_VERSION: "${SIMULATOR_OS_VERSION}"
