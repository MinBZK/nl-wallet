automation-compile-check:
  rules: !reference [.merge-request, rules]
  script:
    - java -version
    - cd uiautomation
    - ./gradlew --no-daemon compileTestKotlin

scheduled-automation-tests-trigger:
  rules:
    - !reference [.default-branch-manual, rules]
  needs:
    - job: deploy-apps-ont
      artifacts: false
      optional: true
  trigger:
    include:
      - local: .gitlab-ci.yml
  variables:
    SCHEDULED: automation

.run-automation-tests-base:
  extends: .env-k8s
  before_script:
    - BROWSERSTACK_USER=$(kubectl get secret nl-wallet-browserstack -o jsonpath='{.data.user}' | base64 --decode)
    - export BROWSERSTACK_USER
    - BROWSERSTACK_KEY=$(kubectl get secret nl-wallet-browserstack -o jsonpath='{.data.key}' | base64 --decode)
    - export BROWSERSTACK_KEY
    - java -version
    - cd uiautomation
    - set -euxo pipefail
  variables:
    APP_IDENTIFIER: "nl.ictu.edi.wallet.latest"
    AUTO_GRANT_PERMISSIONS: "true"
    IOS_ACCEPT_ALERTS: "true"
    ENABLE_BROWSERSTACK_A11Y_CHECKS: false

.extract-reader-ca-credentials:
  extends: .env-k8s
  before_script: &extract-reader-ca-credentials-script
    - AMSTERDAM_CA_KEY_DER=$(kubectl get secret nl-wallet-demo-rp-verification-server-verifier-usecases-mijn-amsterdam -o jsonpath='{.data.private_key}' | base64 --decode)
    - AMSTERDAM_CA_CRT_DER=$(kubectl get secret nl-wallet-demo-rp-verification-server-verifier-usecases-mijn-amsterdam -o jsonpath='{.data.certificate}' | base64 --decode)
    - echo "$AMSTERDAM_CA_KEY_DER" | base64 -d | openssl pkey -inform DER -outform PEM > /tmp/amsterdam.wrpac.key.pem
    - echo "$AMSTERDAM_CA_CRT_DER" | base64 -d | openssl x509 -inform DER -outform PEM > /tmp/amsterdam.wrpac.crt.pem
    - export AMSTERDAM_CA_KEY_FILE=/tmp/amsterdam.wrpac.key.pem
    - export AMSTERDAM_CA_CRT_FILE=/tmp/amsterdam.wrpac.crt.pem
    - MONKEY_BIKE_CA_KEY_DER=$(kubectl get secret nl-wallet-demo-rp-verification-server-verifier-usecases-monkey-bike -o jsonpath='{.data.private_key}' | base64 --decode)
    - MONKEY_BIKE_CA_CRT_DER=$(kubectl get secret nl-wallet-demo-rp-verification-server-verifier-usecases-monkey-bike -o jsonpath='{.data.certificate}' | base64 --decode)
    - echo "$MONKEY_BIKE_CA_KEY_DER" | base64 -d | openssl pkey -inform DER -outform PEM > /tmp/monkey_bike.wrpac.key.pem
    - echo "$MONKEY_BIKE_CA_CRT_DER" | base64 -d | openssl x509 -inform DER -outform PEM > /tmp/monkey_bike.wrpac.crt.pem
    - export MONKEY_BIKE_CA_KEY_FILE=/tmp/monkey_bike.wrpac.key.pem
    - export MONKEY_BIKE_CA_CRT_FILE=/tmp/monkey_bike.wrpac.crt.pem

# Install the Apple development certificate and provisioning profiles that Appium needs to build
# WebDriverAgent for real iOS devices, from the fastlane match repository (read-only). The job
# token must be allowlisted on the certificates project. The login keychain is unlocked first
# because the runner executes outside a GUI session (the runner user's login password comes from
# the nl-wallet-macmini secret); without this, codesign fails with errSecInternalComponent and
# xcodebuild exits with code 65.
# Also extracts the WRPAC CA credentials (composed via YAML anchor so both command lists are
# defined only once); the iOS device jobs use this template via extends.
.install-ios-signing:
  extends: .env-k8s
  before_script:
    - *extract-reader-ca-credentials-script
    - MACOS_KEYCHAIN_PASSWORD="$(kubectl get secret nl-wallet-macmini -o jsonpath='{.data.password}' | base64 --decode)"
    - security unlock-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" ~/Library/Keychains/login.keychain-db
    - security set-keychain-settings ~/Library/Keychains/login.keychain-db
    - MATCH_PASSWORD="$(kubectl get secret nl-wallet-fastlane-match -o jsonpath='{.data.password}' | base64 --decode)"
    - export MATCH_PASSWORD
    - MATCH_GIT_BASIC_AUTHORIZATION="$(printf 'gitlab-ci-token:%s' "$CI_JOB_TOKEN" | base64)"
    - export MATCH_GIT_BASIC_AUTHORIZATION
    - export PATH="$HOME/.rbenv/shims:$HOME/.rbenv/bin:$PATH"
    - bundle install
    - bundle exec fastlane match development --readonly
    # Quoted because the unquoted 'codesign: ' colon would make YAML parse this line as a mapping.
    - 'security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${MACOS_KEYCHAIN_PASSWORD}" ~/Library/Keychains/login.keychain-db > /dev/null'
    # Point the WebDriverAgentRunner target at the match profile (per-target manual signing);
    # see the script header why neither automatic signing nor a global xcconfig works.
    - bundle exec ruby deploy/qa-util/patch-wda-signing.rb

automation-tests-load-device-config:
  extends: .env-k8s
  rules:
    - !reference [.on-schedule-automation, rules]
  script:
    - |
      SECRET_JSON=$(kubectl get secret nl-wallet-macmini -o json)
      : > devices.env
      for key in \
        android_device_1_udid \
        android_1_name \
        android_1_os_version \
        android_2_udid \
        android_2_name \
        android_2_os_version \
        ios_1_udid \
        ios_1_name \
        ios_1_os_version \
        ios_2_udid \
        ios_2_name \
        ios_2_os_version \
        emulator_udid \
        emulator_os_version \
        simulator_udid \
        simulator_os_version \
      ; do
        value=$(echo "$SECRET_JSON" | jq -r --arg k "$key" '.data[$k] // empty' | base64 --decode)
        upper=$(echo "$key" | tr '[:lower:]' '[:upper:]')
        # No surrounding quotes: GitLab's dotenv artifact parser keeps them as
        # literal characters, which would corrupt the value (e.g. an iOS UDID
        # would become '"<udid>"' and Appium rejects it as an unknown device).
        printf '%s=%s\n' "$upper" "$value" >> devices.env
      done
  artifacts:
    reports:
      dotenv: devices.env

.fetch-android-app:
  before_script:
    - mc cp "qt/quality-time/apps/nl.ictu.edi.wallet.latest-release.apk" "nl.ictu.edi.wallet.latest-release.apk"

.fetch-ios-app:
  before_script:
    - mc cp "qt/quality-time/apps/nl.ictu.edi.wallet.latest.ipa" "nl.ictu.edi.wallet.latest.ipa"

.fetch-ios-simulator-app:
  before_script:
    - mkdir -p wallet_app/build/ios/iphonesimulator
    - mc cp "qt/quality-time/apps/Runner.app.zip" "wallet_app/build/ios/iphonesimulator/Runner.app.zip"

.automation-tests-macos-devices:
  resource_group: automation-tests
  tags:
    - macos-devices
  artifacts:
    name: uiautomation
    when: always
    paths:
      - uiautomation/build/test-results/**/*.xml
      - uiautomation/build/allure-results
      - uiautomation/build/reports
      - uiautomation/build/page-sources
      - uiautomation/appium.log
    reports:
      junit: uiautomation/build/test-results/**/*.xml
  rules:
    - !reference [.on-schedule-automation, rules]

.automation-tests-macos-android-devices:
  extends: .automation-tests-macos-devices
  variables:
    ANDROID_HOME: "/opt/homebrew/share/android-commandlinetools"
    ANDROID_SDK_ROOT: "/opt/homebrew/share/android-commandlinetools"

.automation-two-device-tests:
  script: |
    cd uiautomation
    ./gradlew --no-daemon --info --stacktrace test --tests ${TEST_SUITE} \
      -Dtest.config.app.identifier="nl.ictu.edi.wallet.latest" \
      -Dtest.config.source.app.path="../${SOURCE_APP}" \
      -Dtest.config.source.platform.name="${SOURCE_PLATFORM_NAME}" \
      -Dtest.config.source.name="${SOURCE_DEVICE_NAME}" \
      -Dtest.config.source.udid="${SOURCE_DEVICE_UDID}" \
      -Dtest.config.source.platform.version="${SOURCE_PLATFORM_VERSION}" \
      -Dtest.config.destination.app.path="../${DESTINATION_APP}" \
      -Dtest.config.destination.platform.name="${DESTINATION_PLATFORM_NAME}" \
      -Dtest.config.destination.name="${DESTINATION_DEVICE_NAME}" \
      -Dtest.config.destination.udid="${DESTINATION_DEVICE_UDID}" \
      -Dtest.config.destination.platform.version="${DESTINATION_PLATFORM_VERSION}" \
      -Dtest.config.remote=false \
      -Dfile.encoding=UTF-8 \
      || true
    compgen -G "build/test-results/test/*.xml"

.run-automation-tests-common-setup:
  resource_group: automation-tests
  extends: .run-automation-tests-base
  needs:
    - job: build-env-ont
      artifacts: true
      optional: true
  artifacts:
    name: uiautomation
    when: always
    paths:
      - uiautomation/build/test-results/**/*.xml
      - uiautomation/build/allure-results
      - uiautomation/build/reports
      - uiautomation/build/page-sources
    reports:
      junit: uiautomation/build/test-results/**/*.xml

.run-automation-tests-default:
  extends: .run-automation-tests-common-setup
  script:
    - mv browserstack-config/browserstack-oneplus12r-14-NL.yml ./browserstack.yml
    - ./gradlew --no-daemon --info --stacktrace test --tests $TESTS -Dtest.config.remote=true -Dfile.encoding=UTF-8 ||
      true
    # Allow failure in tests and pass when there are test results (Quality Time should report on failed test)
    - compgen -G "build/test-results/test/*.xml"
  rules:
    - !reference [.on-schedule-automation, rules]

.run-automation-tests-ios-default:
  extends: [.automation-tests-macos-devices, .install-ios-signing]
  resource_group: real-device-automation-tests
  needs:
