build-wallet-web:
  image: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/nl-wallet-app-builder-ci-node:${BUILD_TAG}"
  rules: !reference [.default-or-merge-request, rules]
  variables:
    VITE_HELP_BASE_URL: ${WALLET_WEB_HELP_BASE_URL}
  script:
    - set -euxo pipefail
    - cd wallet_web
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm run format-check
    - pnpm run lint
    - pnpm run type-check
    - pnpm run coverage
    - pnpm run build
    # copy the built files to the demo utils assets folder
    - cp -p dist/nl-wallet-web.iife.js ../wallet_core/demo/demo_utils/static/
    - cp -p dist/nl-wallet-web.iife.js ../wallet_core/demo/demo_issuer/assets/
    - cp -p dist/nl-wallet-web.iife.js ../wallet_core/demo/demo_relying_party/assets/
  after_script:
    - deploy/bin/store-artifact.sh wallet_web/test-results/junit.xml qt/quality-time/junit-results/web.xml
    - deploy/bin/store-artifact-zip.sh qt/quality-time/allure-results/web.zip wallet_web/allure-results/*
  artifacts:
    name: wallet-web
    reports:
      junit: wallet_web/test-results/junit.xml
    paths:
      - wallet_web/dist
      - wallet_web/coverage
      - wallet_web/test-results
      - wallet_web/allure-results
      - wallet_core/demo/demo_utils/assets/nl-wallet-web.iife.js
      - wallet_core/demo/demo_issuer/assets/nl-wallet-web.iife.js
      - wallet_core/demo/demo_relying_party/assets/nl-wallet-web.iife.js

test-generate-web-bindings:
  extends: .rust
  rules: !reference [.default-or-merge-request, rules]
  script:
    - scripts/generate-web-bindings.sh
    - git diff
    - if [[ -n $(git status --porcelain) ]]; then echo "Bindings generation results in different files!"; exit 1; fi

test-revocation-portal-js:
  image: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/nl-wallet-app-builder-ci-node:${BUILD_TAG}"
  rules: !reference [.default-or-merge-request, rules]
  script:
    - set -euxo pipefail
    - cd wallet_core/revocation_portal
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm run coverage
  after_script:
    - deploy/bin/store-artifact.sh wallet_core/revocation_portal/test-results/junit.xml
      qt/quality-time/junit-results/revocation-portal.xml
    - deploy/bin/store-artifact-zip.sh qt/quality-time/allure-results/revocation-portal.zip
      wallet_core/revocation_portal/allure-results/*
  artifacts:
    name: test-revocation-portal-js
    reports:
      junit: wallet_core/revocation_portal/test-results/junit.xml
    paths:
      - wallet_core/revocation_portal/coverage/lcov.info
      - wallet_core/revocation_portal/allure-results
      - wallet_core/revocation_portal/test-results/junit.xml

