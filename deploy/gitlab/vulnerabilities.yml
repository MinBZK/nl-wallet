dependency-check:
  image: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/nl-wallet-app-builder-ci-quality:${BUILD_TAG}"
  extends: .env-k8s
  stage: qa
  rules:
    - !reference [.on-schedule-scan, rules]
    - !reference [.default-branch, rules]
    # On merge requests, only run when files that this job scans change
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - deploy/bin/merge-dependency-check-reports.py
        - deploy/dependencies/dependency-check-suppressions.xml
        - deploy/dependencies/dependency-check.init.gradle
        - deploy/docker-images/ci/dependency-check.sh
        - deploy/gitlab/vulnerabilities.yml
        - "**/*.gradle.kts"
        - "**/*.jar"
        - "**/*.podspec"
        - "**/Gemfile.lock"
        - "**/Package.resolved"
        - "**/Package.swift"
        - "**/pnpm-lock.yaml"
        - "**/Podfile.lock"
        - "**/pubspec.lock"
        - "**/requirements.txt"
      interruptible: true
      variables:
        CACHE_POLICY: pull
  needs: []
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    GRADLE_BUILDS: "wallet_app/android wallet_core/wallet/platform_support/android uiautomation"
  before_script:
    - mkdir -p dependency_check_data dependency_check_cli
    - for requirements in $(git ls-files '*requirements.txt'); do
        python3 -m pip install --quiet --no-deps --no-compile --target
        "dependency_check_python/$(dirname "$requirements")" --requirement "$requirements";
      done
    - (cd wallet_app && flutter pub get --enforce-lockfile)
    - export NVD_API_KEY="$(kubectl get secret nl-wallet-nist-nvd -o jsonpath='{.data.api-key}' | base64 --decode)"
    - export OSS_INDEX_USERNAME=$(kubectl get secret nl-wallet-oss-index -o jsonpath='{.data.username}' | base64 --decode)
    - export OSS_INDEX_PASSWORD=$(kubectl get secret nl-wallet-oss-index -o jsonpath='{.data.password}' | base64 --decode)
  script:
    - status=0
    - for build in $GRADLE_BUILDS; do
        (cd "$build" && ./gradlew --no-daemon --init-script
        "$CI_PROJECT_DIR/deploy/dependencies/dependency-check.init.gradle" dependencyCheckAggregate) || status=1;
      done
    - dependency-check.sh --data dependency_check_data --out dependency_check_cli --disableNodeJS
      --disablePip --disablePyPkg --enableExperimental --format "HTML" --format "JSON" --format "XML" --scan "."
      --exclude ".gradle/**" --exclude "**/pubspec.yaml" --suppression deploy/dependencies/dependency-check-suppressions.xml --nvdApiKey "$NVD_API_KEY" --ossIndexUsername "$OSS_INDEX_USERNAME" --ossIndexPassword "$OSS_INDEX_PASSWORD" --failOnCVSS 0.1 || status=1
    - deploy/bin/merge-dependency-check-reports.py . dependency_check_cli
        $(printf 'dependency_check_gradle/%s ' $GRADLE_BUILDS)
    - for ext in json html xml; do deploy/bin/store-artifact.sh dependency-check-report.$ext
      qt/quality-time/dependency-check/report.$ext; done
    - exit $status
  artifacts:
    name: dependency-check
    when: always
    paths:
      - dependency-check-report.json
      - dependency-check-report.html
      - dependency-check-report.xml
      - dependency_check_cli
      - dependency_check_gradle
  cache:
    - key: dependency-check
      when: always
      paths:
        - dependency_check_data
      policy: $CACHE_POLICY
    - key: dependency-check-gradle
      when: always
      paths:
        - .gradle/caches/modules-2
        - .gradle/wrapper
      policy: $CACHE_POLICY
  allow_failure: true

osv-scanner:
  image: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/nl-wallet-app-builder-ci-quality:${BUILD_TAG}"
  stage: qa
  rules:
    - !reference [.on-schedule-scan, rules]
    - !reference [.default-or-merge-request, rules]
  needs: []
  script:
    - |
      osv-scanner --config=$CI_PROJECT_DIR/deploy/dependencies/osv-scanner.toml --format sarif --recursive "$CI_PROJECT_DIR" > osv.sarif \
        || osv-scanner --config=$CI_PROJECT_DIR/deploy/dependencies/osv-scanner.toml --format table --recursive "$CI_PROJECT_DIR"
  after_script:
    - deploy/bin/store-artifact.sh osv.sarif qt/quality-time/
  artifacts:
    name: osv-scanner
    when: always
    paths:
      - osv.sarif
  allow_failure: true

.trivy:
  image: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/nl-wallet-app-builder-ci-quality:${BUILD_TAG}"
  before_script:
    - |
      BASIC_AUTH="${HARBOR_ROBOT_NAME}:$(base64 --decode <<< ${HARBOR_ROBOT_SECRET})"
      mapfile -t BUILD_IMAGES < deploy/build-images.txt
      CI_IMAGES=(
      "nl-wallet-app-builder-ci-android-emulator"
      "nl-wallet-app-builder-ci-playwright"
      "nl-wallet-app-builder-ci-quality"
      "nl-wallet-app-builder-ci-ansible"
      )
      OTHER_IMAGES=(
      "nl-rdo-max"
      "nl-wallet-hsm-simulator"
      )
    - set -euo pipefail

trivy-scan:
  extends: .trivy
  stage: qa
  rules:
    - !reference [.on-schedule-trigger-scan, rules]
  needs: []
  script:
    - |
      reference_from_last_push() {
        local image=$1
        local url="https://${HARBOR_REGISTRY}/api/v2.0/projects/${HARBOR_PROJECT}/repositories/${image}/artifacts?page_size=1&page=1&sort=-push_time"
        local reference="$(curl -fsS --user "${BASIC_AUTH}" "$url" | jq -r '.[0].tags[0].name')"
        [[ -n $reference ]] || return 1
        echo "$reference"
      }

      trigger_new_scan() {
        local image=$1
        local reference=$2
        local url="https://${HARBOR_REGISTRY}/api/v2.0/projects/${HARBOR_PROJECT}/repositories/${image}/artifacts/${reference}/scan"
        if ! curl -fsS --user "${BASIC_AUTH}" -XPOST "$url"; then
          >&2 echo "ERROR: Could not trigger new scan for image $image and reference $reference"
        fi
      }

      for image in "${BUILD_IMAGES[@]}"; do
        trigger_new_scan $image $CI_COMMIT_SHORT_SHA
      done

      for image in "${CI_IMAGES[@]}"; do
        trigger_new_scan $image $BUILD_TAG
      done

      for image in "${OTHER_IMAGES[@]}"; do
        reference="$(reference_from_last_push $image)"
        trigger_new_scan $image $reference
      done

trivy-publish:
  extends: .trivy
  stage: publish
  rules:
    - !reference [.on-schedule-scan, rules]
    - !reference [.default-branch, rules]
  needs:
    - job: build-wallet-provider-image
      artifacts: false
      optional: true
    - job: build-wallet-provider-migrations-image
      artifacts: false
      optional: true
    - job: build-audit-log-migrations-image
      artifacts: false
      optional: true
    - job: build-demo-relying-party-image
      artifacts: false
      optional: true
    - job: build-demo-issuer-image
      artifacts: false
      optional: true
    - job: build-demo-index-image
      artifacts: false
      optional: true
    - job: build-verification-server-image
      artifacts: false
      optional: true
    - job: build-verification-server-migrations-image
      artifacts: false
      optional: true
    - job: build-issuance-server-image
      artifacts: false
      optional: true
    - job: build-issuance-server-migrations-image
      artifacts: false
      optional: true
    - job: build-pacf-issuance-server-image
      artifacts: false
      optional: true
    - job: build-pacf-issuance-server-migrations-image
      artifacts: false
      optional: true
    - job: build-acf-demo-issuer-image
      artifacts: false
      optional: true
    - job: build-acf-demo-issuer-migrations-image
      artifacts: false
      optional: true
    - job: build-pid-issuer-image
      artifacts: false
      optional: true
    - job: build-pid-issuer-migrations-image
      artifacts: false
      optional: true
    - job: build-revocation-portal-image
      artifacts: false
      optional: true
    - job: build-admin-portal-image
      artifacts: false
      optional: true
    - job: build-gba-hc-converter-image
      artifacts: false
      optional: true
    - job: build-gba-fetch-image
      artifacts: false
      optional: true
    - job: build-gba-fetch-frontend-image
      artifacts: false
      optional: true
    - job: build-update-policy-server-image
      artifacts: false
      optional: true
  script:
    - |
      BASIC_AUTH="${HARBOR_ROBOT_NAME}:$(base64 --decode <<< ${HARBOR_ROBOT_SECRET})"

      vulnerability_url_last_push() {
        local image=$1
        local url="https://${HARBOR_REGISTRY}/api/v2.0/projects/${HARBOR_PROJECT}/repositories/${image}/artifacts?page_size=1&page=1&sort=-push_time"
        local href="$(curl -fsS --user "${BASIC_AUTH}" "$url" | jq -r '.[0].addition_links.vulnerabilities.href')"
        [[ -n $href ]] || return 1
        echo "https://${HARBOR_REGISTRY}${href}"
      }

      vulnerability_url_from_ref() {
        local image=$1
        local reference=$2
        local url="https://${HARBOR_REGISTRY}/api/v2.0/projects/${HARBOR_PROJECT}/repositories/${image}/artifacts/${reference}"
        local href="$(curl -fsS --user "${BASIC_AUTH}" "$url" | jq -r '.addition_links.vulnerabilities.href')"
        [[ -n $href ]] || return 1
        echo "https://${HARBOR_REGISTRY}${href}"
      }

      declare -A urls

      for image in "${BUILD_IMAGES[@]}"; do
        urls[$image]="$(vulnerability_url_from_ref $image $CI_COMMIT_SHORT_SHA)"
      done

      for image in "${CI_IMAGES[@]}"; do
        urls[$image]="$(vulnerability_url_from_ref $image $BUILD_TAG)"
      done

      for image in "${OTHER_IMAGES[@]}"; do
        urls[$image]="$(vulnerability_url_last_push $image)"
      done

      mkdir trivy
      for image in "${!urls[@]}"; do
        url="${urls[$image]}"
        curl -fsS --user "${BASIC_AUTH}" -o "trivy/${image}.json" "$url"
      done
  after_script:
    - deploy/bin/store-artifact.sh trivy/* qt/quality-time/trivy/
  artifacts:
    name: trivy
    when: always
    paths:
      - trivy
  allow_failure: true
