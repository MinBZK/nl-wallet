run-digid-bridge-test-ont:
  extends:
    - .test-rust
    - .env-k8s
  rules: !reference [.default-or-merge-request-manual, rules]
  needs:
    - job: build-env-ont
      artifacts: true
  variables:
    SKIP_DIGID_CONNECTOR: "true"
    SKIP_WALLET_WEB: "true"
    SKIP_KEYCLOAK: "true"
    DB_HOST: "postgres"
  services:
    - name: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/nl-wallet-app-builder-postgres:${BUILD_TAG}"
      alias: postgres
      command: [
          "postgres",
          # Allow for more connections with larger shared buffers
          "-N",
          "768",
          "-c",
          "shared_buffers=128MB",
          # Use non-durable settings: https://www.postgresql.org/docs/current/non-durability.html
          "-c",
          "fsync=off",
          "-c",
          "synchronous_commit=off",
          "-c",
          "full_page_writes=off",
          # Minimal WAL
          "-c",
          "wal_level=minimal",
          "-c",
          "max_wal_senders=0",
        ]
      variables:
        POSTGRES_USER: "postgres"
        POSTGRES_PASSWORD: "postgres"
  before_script:
    - set -euo pipefail
    - PID_ISSUER__DIGID__BSN_PRIVKEY="$(kubectl get secret nl-wallet-pid-issuer-digid-bsn-privkey --output=jsonpath='{.data.bsn_privkey}' | base64 --decode)"
    - export PID_ISSUER__DIGID__BSN_PRIVKEY
    - PID_ISSUER__DIGID__CLIENT_SETTINGS__TRUST_ANCHORS="$(kubectl get configmap nl-wallet-pid-issuer-digid-http-trust-anchors --output=jsonpath='{.data.trust_anchors}')"
    - export PID_ISSUER__DIGID__CLIENT_SETTINGS__TRUST_ANCHORS
    - PID_ISSUER__DIGID__CLIENT_SETTINGS__OIDC_IDENTIFIER="$DIGID_BASE_URL"
    - export PID_ISSUER__DIGID__CLIENT_SETTINGS__OIDC_IDENTIFIER
    - PID_ISSUER__DIGID__CLIENT_ID="$DIGID_CLIENT_ID"
    - export PID_ISSUER__DIGID__CLIENT_ID
    # Port-forward brpproxy (internal-only in the cluster) to localhost for the in-process pid_issuer.
    - kubectl port-forward service/brpproxy 5001:80 &
    - export PID_ISSUER__BRP_SERVER="http://localhost:5001/"
  script:
    - ./scripts/setup-devenv.sh
    - cd wallet_core
    - RUST_BACKTRACE=1 CONFIG_ENV=dev cargo nextest run --package tests_integration --test digid_issuance --features
      digid_test --locked

.run-performance-test-ont-base:
  extends: .env-k8s
  script:
    - START_TIME=$(date -u -d "-1 minute" "+%Y-%m-%d %H:%M:%S")
    - echo "Performance test starting, query range begins at $START_TIME"
    - DELAY=0.2 wallet_core/tests_integration/run_performance_test.sh --skip-build 25
    - END_TIME=$(date -u -d "+1 minute" "+%Y-%m-%d %H:%M:%S")
    - echo "Performance test completed, query range ends at $END_TIME"
    - echo "START_TIME=$START_TIME" > perf-test-timeframe.txt
    - echo "END_TIME=$END_TIME" >> perf-test-timeframe.txt
  artifacts:
    paths:
      - perf-test-timeframe.txt
    when: on_success

run-performance-test-ont-pipeline-deploy:
  extends: .run-performance-test-ont-base
  rules:
    - !reference [.default-branch, rules]
  needs:
    - job: build-performance-test
      artifacts: true
    - job: deploy-apps-ont
      artifacts: false
  allow_failure: false

run-performance-test-ont-existing-deploy:
  extends: .run-performance-test-ont-base
  rules:
    - !reference [.on-schedule-nightly-performance-test, rules]
    - !reference [.default-manual-or-merge-request-manual, rules]
  needs:
    - job: build-performance-test
      artifacts: true
  allow_failure: true

retrieve-performance-test-results-ont:
  extends: .env-k8s
  rules:
    - !reference [.on-schedule-nightly-performance-test, rules]
  needs:
    - job: run-performance-test-ont-existing-deploy
      artifacts: true
  before_script:
    - python3 -m venv venv
    - source venv/bin/activate
    - pip3 install --no-cache-dir --upgrade pip
    - pip3 install --no-cache-dir -r deploy/qa-util/requirements.txt
  script:
    - START_TIME=$(grep START_TIME perf-test-timeframe.txt | cut -d'=' -f2-)
    - END_TIME=$(grep END_TIME perf-test-timeframe.txt | cut -d'=' -f2-)
    - echo "Using START_TIME=${START_TIME} and END_TIME=${END_TIME}"
    - |
      python3 deploy/qa-util/generate-k6-summary-from-grafana.py \
        --grafana-url "${SP_GRAFANA_TEST_API_URL}" \
        --api-token "${SP_GRAFANA_TEST_API_KEY}" \
        --start-time "$START_TIME" \
        --end-time "$END_TIME" \
        --output-file k6-summary.json
  after_script:
    - deploy/bin/store-artifact.sh k6-summary.json qt/quality-time/performance-results/k6-summary.json
  artifacts:
    paths:
      - k6-summary.json
    when: on_success
  variables:
    TESTS:

extract-manual-test-set:
  rules: !reference [.default-branch-manual, rules]
  script:
    - ./deploy/qa-util/extract-manual-test-set.sh wallet_docs/functional-design/logical-test-cases.md manual-test-set.md
  artifacts:
    name: manual-test-set
    when: always
    paths:
      - manual-test-set.md

