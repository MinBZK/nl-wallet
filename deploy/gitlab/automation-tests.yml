browsertests-format-lint:
  rules: !reference [.default-or-merge-request, rules]
  image: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/nl-wallet-app-builder-ci-node:${BUILD_TAG}"
  script:
    - cd browsertests
    - pnpm install --frozen-lockfile
    - pnpm run format-check
    - pnpm run lint

.run-browsertest-common:
  image: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/nl-wallet-app-builder-ci-playwright:${BUILD_TAG}"
  extends: .env-k8s
  rules:
    - !reference [.default-branch, rules]
  needs:
    - job: build-env-ont
      artifacts: true
    - job: deploy-apps-ont
      artifacts: false
  before_script:
    - cd browsertests
    - pnpm install --frozen-lockfile

run-wallet-web-browsertest-test-ont:
  extends: .run-browsertest-common
  script:
    - cd packages/wallet-web
    - pnpm run test:ci
  after_script:
    - deploy/bin/store-artifact.sh browsertests/packages/wallet-web/test-results/results.xml
      qt/quality-time/junit-results/browsertest-wallet-web.xml
    - deploy/bin/store-artifact-zip.sh qt/quality-time/allure-results/browsertest-wallet-web.zip
      browsertests/packages/wallet-web/allure-results/*
  artifacts:
    name: browsertest-wallet-web
    when: always
    paths:
      - browsertests/packages/wallet-web/test-results/
      - browsertests/packages/wallet-web/allure-results/
    reports:
      junit: browsertests/packages/wallet-web/test-results/*.xml

run-fallback-pages-browsertest-test-ont:
  extends: .run-browsertest-common
  script:
    - cd packages/fallback-pages
    - pnpm run test:ci
  after_script:
    - deploy/bin/store-artifact.sh browsertests/packages/fallback-pages/test-results/results.xml
      qt/quality-time/junit-results/browsertest-fallback-pages.xml
    - deploy/bin/store-artifact-zip.sh qt/quality-time/allure-results/browsertest-fallback-pages.zip
      browsertests/packages/fallback-pages/allure-results/*
  artifacts:
    name: browsertest-fallback-page
    when: always
    paths:
      - browsertests/packages/fallback-pages/test-results/
      - browsertests/packages/fallback-pages/allure-results/
    reports:
      junit: browsertests/packages/fallback-pages/test-results/*.xml

run-revocation-portal-browsertest-test-ont:
  extends: .run-browsertest-common
  script:
    - cd packages/revocation-portal
    - pnpm run test:ci
  after_script:
    - deploy/bin/store-artifact.sh browsertests/packages/revocation-portal/test-results/results.xml
