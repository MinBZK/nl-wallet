.build-app-trigger:
  rules:
    - !reference [.default-branch-manual, rules]
  needs:
    - job: test-flutter
      artifacts: false
    - job: test-flutter-ui
      artifacts: false
    - job: test-flutter-rust-bridge-codegen
      artifacts: false
    - job: test-rust
      artifacts: false
    - job: test-rust-doctest
      artifacts: false
    - job: test-android
      artifacts: false
    - job: test-rust-compilation-android
      artifacts: false
    - job: test-ios
      artifacts: false
    - job: test-rust-compilation-ios
      artifacts: false
  trigger:
    include:
      - local: .gitlab-ci.yml

build-mock-trigger:
  extends: .build-app-trigger
  variables:
    BUILD: 'mock'

build-demo-trigger:
  extends: .build-app-trigger
  variables:
    BUILD: 'demo'
