build-sbom:
  image: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/nl-wallet-app-builder-ci-quality:${BUILD_TAG}"
  extends: .ruby-cache
  stage: build
  rules: !reference [.default-or-merge-request-manual, rules]
  needs: []
  script:
    - bundle install
    - sbom_output=$(mktemp -d)
    - bash scripts/sbom/generate.sh "$sbom_output"
    - cp "$sbom_output"/bom*.json "$sbom_output"/bom*.xml .
    - deploy/bin/store-artifact.sh bom.json bom.xml qt/quality-time/sbom/
    - deploy/bin/store-artifact.sh bom-prod.json bom-prod.xml qt/quality-time/sbom-prod/
  variables:
    LC_ALL: "C.UTF-8"
    LANG: "C.UTF-8"
  artifacts:
    name: sbom
    when: always
    reports:
      cyclonedx:
        - bom.json
        - bom-prod.json
    paths:
      - bom.xml
      - bom.json
      - bom-prod.xml
      - bom-prod.json
  allow_failure: true

.upload-sbom-to-dependency-track:
  image: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/nl-wallet-app-builder-ci-quality:${BUILD_TAG}"
  extends: .env-k8s
  stage: qa
  rules: !reference [.default-branch, rules]
  needs:
    - job: build-env-ont
      artifacts: true
    - job: build-sbom
      artifacts: true
  script: |
    set -euo pipefail
    test -s "$BOM_FILENAME"
    PROJECT_ID=$(kubectl get secret nl-wallet-dependency-track-secret -o jsonpath="{.data.${DEPENDENCY_TRACK_PROJECT_ID_KEY}}" | base64 --decode)
    : "${PROJECT_ID:?Missing Dependency-Track project ID}"
    API_KEY=$(kubectl get secret nl-wallet-dependency-track-secret -o jsonpath='{.data.api_key}' | base64 --decode)
    URL=$(kubectl get secret nl-wallet-dependency-track-secret -o jsonpath='{.data.url}' | base64 --decode)
    : "${API_KEY:?Missing Dependency-Track API key}"
    : "${URL:?Missing Dependency-Track upload URL}"
    # Stream the file as multipart data, avoiding a large base64 shell variable.
    curl -f -X POST "$URL" \
      -H "X-API-Key: $API_KEY" \
      --form-string "project=$PROJECT_ID" \
      --form "bom=@$BOM_FILENAME;type=application/json"
  allow_failure: true

upload-sbom-to-dependency-track:
  extends: .upload-sbom-to-dependency-track
  variables:
    BOM_FILENAME: bom.json
    DEPENDENCY_TRACK_PROJECT_ID_KEY: project_id

upload-prod-sbom-to-dependency-track:
  extends: .upload-sbom-to-dependency-track
  variables:
    BOM_FILENAME: bom-prod.json
    DEPENDENCY_TRACK_PROJECT_ID_KEY: prod_project_id
