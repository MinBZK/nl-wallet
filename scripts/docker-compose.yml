services:
  postgres:
    container_name: postgres
    image: docker.io/library/postgres
    environment:
      # POSTGRES_HOST_AUTH_METHOD=trust is recommended only for development.
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    network_mode: bridge
    volumes:
      - postgres:/var/lib/postgresql
      - ./sql:/docker-entrypoint-initdb.d

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:latest
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_USERNAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_PASSWORD}
      - KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/data/certs/keycloak.crt
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/data/certs/keycloak.key
    ports:
      - "${KC_PORT_HTTP}:8080"
      - "${KC_PORT_HTTPS}:8443"
    network_mode: bridge
    volumes:
      - keycloak:/opt/keycloak/data
    command:
      - start-dev
      - --import-realm

networks:
  default:
    external: true
    name: bridge

volumes:
  postgres:
    name: postgres
  keycloak:
    name: keycloak
