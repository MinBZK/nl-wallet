[package]
name = "wallet_configuration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[[bin]]
name = "verify_wallet_config"
required-features = ["verify"]

[features]
# Allow Credential Issuer Identifiers to contain "http://".
allow_insecure_url = ["openid4vc/allow_insecure_url"]
# Build the `verify_wallet_config` binary, which verifies a wallet configuration JWT like the wallet does.
verify = ["dep:anyhow", "dep:clap", "dep:serde_json"]
# Have the WalletConfiguration type implement Serialize, for testing purposes.
test = []

[dependencies]
anyhow = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, optional = true, features = ["derive"] }
derive_more = { workspace = true, features = ["debug"] }
itertools.workspace = true
rustls-pki-types.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
serde_with = { workspace = true, features = ["base64"] }
thiserror.workspace = true
url = { workspace = true, features = ["serde"] }

attestation_data.path = "../../lib/attestation_data"
attestation_types.path = "../../lib/attestation_types"
crypto.path = "../../lib/crypto"
error_category.path = "../../lib/error_category"
http_utils = { path = "../../lib/http_utils", features = ["client"] }
jwt.path = "../../lib/jwt"
openid4vc.path = "../../lib/openid4vc"
utils.path = "../../lib/utils"
