[package]
name = "device_integration_tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.sbom]
production-root = false

[lints]
workspace = true

[lib]
crate-type = ["staticlib", "cdylib"]
doctest = false

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

platform_support = { path = "../platform_support", features = ["hardware_integration_test", "ios_session_crypto"] }
wallet = { path = "..", features = ["hardware_integration_test"] }
