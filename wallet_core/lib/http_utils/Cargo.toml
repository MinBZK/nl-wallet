[package]
name = "http_utils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
# Allow Credential Issuer Identifiers to contain "http://" and allow the Origin type to contain "https://".
allow_insecure_url = []
# Include implementations for http clients
client = ["dep:utils", "dep:x509-parser", "derive_more/as_ref", "derive_more/debug", "reqwest/gzip", "serde_with/base64"]
# Include implementations of the axum IntoResponse trait.
server = [
    "axum/json",
    "dep:axum-server",
    "derive_more/constructor",
    "dep:mediatype",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:tracing",
    "dep:futures",
    "serde_with/base64",
    "tower-http/cors",
]
# Include code to use for testing purposes
test = ["client", "dep:base64"]
# Include HTTPS client code for testing using the httpmock crate.
httpmock = ["client", "dep:const-decoder"]

[dependencies]
async-trait.workspace = true
http.workspace = true
itertools.workspace = true
mime.workspace = true
nutype = { workspace = true, features = ["regex", "serde"] }
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_with.workspace = true
thiserror.workspace = true
url = { workspace = true, features = ["serde"] }

axum = { workspace = true, optional = true }
axum-server = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
const-decoder = { workspace = true, optional = true }
derive_more = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
mediatype = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true }

utils = { path = "../utils", optional = true }

[dev-dependencies]
base64.workspace = true
rstest.workspace = true
strum = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt"] }
toml.workspace = true
