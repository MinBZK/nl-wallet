[package]
name = "openid4vc_server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
exclude = ["resources"]

[lints]
workspace = true

[lib]
doctest = false

[[test]]
name = "issuance"
path = "tests/issuance.rs"
required-features = ["issuance"]

[features]
# Enable issuance
issuance = [
    "axum-extra/typed-header",
    "dep:axum",
    "dep:crypto",
    "dep:http",
    "dep:http_utils",
    "dep:mediatype",
    "dep:oauth",
    "dep:openid4vc",
    "dep:sd_jwt_vc_metadata",
    "dep:token_status_list",
    "dep:tracing",
    "dep:utils",
    "dep:wscd",
    "jwt/axum",
]
# Enable disclosure
disclosure = [
    "dep:attestation_data",
    "dep:axum",
    "dep:crypto",
    "dep:dcql",
    "dep:http",
    "dep:http_utils",
    "dep:jwt",
    "dep:oauth",
    "dep:openid4vc",
    "dep:serde",
    "dep:token_status_list",
    "dep:tower-http",
    "dep:tracing",
    "dep:utils",
]

[dependencies]
axum = { workspace = true, optional = true, features = ["form", "json"] }
axum-extra = { workspace = true, optional = true }
http = { workspace = true, optional = true }
mediatype = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
tower-http = { workspace = true, optional = true, features = ["cors"] }
tracing = { workspace = true, optional = true }

attestation_data = { path = "../attestation_data", optional = true }
crypto = { path = "../crypto", optional = true }
dcql = { path = "../dcql", optional = true }
http_utils = { path = "../http_utils", optional = true, features = ["server"] }
jwt = { path = "../jwt", optional = true }
oauth = { path = "../oauth", optional = true }
openid4vc = { path = "../openid4vc", optional = true, features = ["axum"] }
sd_jwt_vc_metadata = { path = "../sd_jwt_vc_metadata", optional = true }
token_status_list = { path = "../token_status_list", optional = true }
utils = { path = "../utils", optional = true }
wscd = { path = "../wscd", optional = true }

[dev-dependencies]
axum-server.workspace = true
indexmap.workspace = true
itertools.workspace = true
p256.workspace = true
rand_core.workspace = true
reqwest.workspace = true
rstest.workspace = true
serde_qs.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["test-util", "macros", "net"] }
tower = { workspace = true, features = ["util"] }
url = { workspace = true, features = ["serde"] }

attestation_data.path = "../attestation_data"
attestation_types.path = "../attestation_types"
http_utils = { path = "../http_utils", features = ["client"] }
jwe.path = "../jwe"
jwt.path = "../jwt"
openid4vc = { path = "../openid4vc", features = ["mock", "test"] }
sd_jwt_vc_metadata.path = "../sd_jwt_vc_metadata"
wscd = { path = "../wscd", features = ["mock"] }
