[package]
name = "wscd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
mock = [
    "chrono/now",
    "attestation_types/mock",
    "crypto/mock",
    "crypto/generate",
    "utils/mock_time",
] # Include the IssuanceMockRemoteWscd and MockWiaClient types.

[dependencies]
chrono.workspace = true
derive_more = { workspace = true, features = ["constructor"] }
futures.workspace = true
itertools.workspace = true
p256.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_with.workspace = true
strum.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

attestation_types.path = "../attestation_types"
crypto.path = "../crypto"
error_category.path = "../error_category"
jwt.path = "../jwt"
utils.path = "../utils"

[dev-dependencies]
chrono = { workspace = true, features = ["now"] }
derive_more = { workspace = true, features = ["as_ref"] }
rstest.workspace = true
serde_json.workspace = true

attestation_types = { path = "../attestation_types", features = ["mock"] }
crypto = { path = "../crypto", features = ["mock", "generate"] }
utils = { path = "../utils", features = ["mock_time"] }
