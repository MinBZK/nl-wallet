[package]
name = "wscd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
mock = [
    "dep:rand_core",
    "chrono/now",
    "derive_more/as_ref",
    "attestation_types/mock",
    "crypto/mock",
    "crypto/generate",
    "utils/mock_time",
] # Include the MockRemoteWscd and MockWiaClient types and adds a mock method on Poa.
# Include key examples from the ISO specification for MockRemoteWscd.
examples = ["mock", "crypto/examples"]

[dependencies]
chrono.workspace = true
derive_more = { workspace = true, features = ["constructor"] }
futures.workspace = true
itertools.workspace = true
p256.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_with.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

attestation_types.path = "../attestation_types"
crypto.path = "../crypto"
jwt.path = "../jwt"
utils.path = "../utils"

rand_core = { workspace = true, optional = true }

[dev-dependencies]
chrono = { workspace = true, features = ["now"] }
derive_more = { workspace = true, features = ["as_ref"] }
rand_core.workspace = true
rstest.workspace = true

attestation_types = { path = "../attestation_types", features = ["mock"] }
crypto = { path = "../crypto", features = ["mock", "generate"] }
utils = { path = "../utils", features = ["mock_time"] }
