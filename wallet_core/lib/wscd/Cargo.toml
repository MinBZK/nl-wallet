[package]
name = "wscd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
# Include the MockRemoteWscd and MockWiaClient types and adds a mock method on Poa.
mock = [
    "dep:rand_core",
    "chrono/now",
    "attestation_types/mock",
    "crypto/mock",
    "crypto/generate",
    "jwt/mock",
    "utils/mock_time",
]
# Include key examples from the ISO specification for MockRemoteWscd.
examples = ["mock", "crypto/examples"]

[dependencies]
derive_more = { workspace = true, features = ["as_ref", "from", "constructor"] }
futures.workspace = true
itertools.workspace = true
p256.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

crypto.path = "../crypto"
jwt.path = "../jwt"
utils.path = "../utils"

chrono = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }

attestation_types = { path = "../attestation_types", optional = true }

[dev-dependencies]
chrono = { workspace = true, features = ["now"] }
rand_core.workspace = true
rstest.workspace = true
tokio = { workspace = true, features = ["macros"] }

attestation_types = { path = "../attestation_types", features = ["mock"] }
crypto = { path = "../crypto", features = ["mock", "generate"] }
jwt = { path = "../jwt", features = ["mock"] }
utils = { path = "../utils", features = ["mock_time"] }
