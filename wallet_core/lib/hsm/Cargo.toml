[package]
name = "hsm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
# Include mock implementations and constructors for testing
mock = ["dep:dashmap", "dep:hmac", "dep:rand", "dep:sha2"]
# Include TestCase type
test = ["mock", "async-dropper/simple", "dep:async-trait", "config/toml", "crypto/test", "dep:rand_core","dep:regex", "dep:tempfile"]
# Integration test feature
hsm_test = ["test"]
# Include the known answer tests, which need to import key material with known values. Only HSMs
# that support key import, such as SoftHSM, can run these.
hsm_test_key_import = ["hsm_test"]

[[test]]
name = "hsm"
path = "tests/hsm.rs"
required-features = ["hsm_test"]

[[test]]
name = "hsm_test_key_import"
path = "tests/hsm_test_key_import.rs"
required-features = ["hsm_test_key_import"]

[[test]]
name = "mock"
path = "tests/mock.rs"
required-features = ["test"]

[dependencies]
cryptoki.workspace = true
cryptoki-sys.workspace = true
der.workspace = true
derive_more = { workspace = true, features = ["as_ref", "constructor", "debug"] }
futures.workspace = true
metrics.workspace = true
p256 = {workspace = true, features = ["pkcs8"]}
r2d2-cryptoki.workspace = true
sec1.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_with = { workspace = true, features = ["base64"] }
strum = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true

async-dropper = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
config = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

crypto.path = "../crypto"
measure.path = "../measure"
utils.path = "../utils"

[dev-dependencies]
rstest.workspace = true
serial_test.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
